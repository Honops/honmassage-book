<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf6f1">
  <title id="page-title">Lecture — HonoMassage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="Changer de thème">🌙</button>

  <header class="page-header">
    <div class="container">
      <a href="chapitres.html" class="back-link">← Sommaire</a>
    </div>
  </header>

  <main>
    <div class="container">

      <article class="chapitre-lecture">
        <p class="chapitre-numero-label" id="chapitre-numero-label"></p>
        <h1 id="chapitre-titre">Chargement...</h1>

        <div class="chapitre-actions">
        <button type="button" id="speech-btn" class="btn btn-secondary" disabled>
          🔊 Écouter
        </button>
        <button type="button" id="speech-stop-btn" class="btn btn-secondary" style="display: none;">
          ⏹ Arrêter
        </button>
        <select id="speech-rate" class="speech-rate-select" aria-label="Vitesse de lecture">
          <option value="0.5">0,5×</option>
          <option value="0.75">0,75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1,25×</option>
          <option value="1.5">1,5×</option>
          <option value="1.7">1,7×</option>
          <option value="1.8">1,8×</option>
          <option value="2">2×</option>
        </select>
        <button type="button" id="music-toggle-btn" class="btn btn-secondary" aria-pressed="false">
          🎵 Musique : désactivée
        </button>
        <audio id="ambient-audio" loop preload="none" src="audio/ambiance-douce.mp3"></audio>
        </div>

        <div id="chapitre-contenu" class="chapitre-contenu">
          <!-- Contenu du chapitre inséré dynamiquement -->
        </div>
      </article>

      <nav class="chapitre-navigation">
        <a href="#" id="nav-precedent" class="btn btn-secondary nav-precedent" style="display: none;">
          ← Chapitre précédent
        </a>
        <a href="#" id="nav-suivant" class="btn btn-primary nav-suivant" style="display: none;">
          Chapitre suivant →
        </a>
      </nav>

    </div>
  </main>
<script src="js/theme.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/book.js"></script>
</body>
</html>
