<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HonoMassage — Livre numérique</title>
  <meta name="description" content="HonoMassage — un manuel de massage bien-être en 12 chapitres, à lire en ligne.">
  <meta name="theme-color" content="#faf6f1">
  <meta property="og:title" content="HonoMassage — Livre numérique">
  <meta property="og:description" content="Un manuel de massage bien-être en 12 chapitres, à lire en ligne.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="Changer de thème">🌙</button>

  <main class="home">

    <section class="cover">
      <div class="cover-image-wrap">
        <img
          class="cover-image"
          src="images/cover/honomassage-cover.webp"
          alt="Séance de massage bien-être dans une ambiance chaleureuse et apaisante"
        >
      </div>

      <div class="cover-panel">
        <h1 class="cover-title">HonoMassage</h1>
        <p class="cover-subtitle">Manuel pratique du massage bien-être</p>
        <p class="cover-tagline">Gestes, préparation, environnement et pratique</p>
        <p class="cover-chapters">12 chapitres pour apprendre, comprendre et pratiquer le massage bien-être</p>

        <div class="cover-author">
          <span class="cover-author-rule"></span>
          <p class="cover-author-name">Alhassane Hono Toure</p>
        </div>
      </div>
    </section>

    <div class="container home-actions-wrap">
      <div class="home-actions">
        <a href="chapitres.html" class="btn btn-primary">Commencer la lecture</a>

        <a
          href="#"
          id="resume-btn"
          class="btn btn-secondary"
          style="display: none;"
        >Reprendre la lecture</a>

        <a href="chapitres.html" class="home-toc-link">Voir le sommaire</a>
      </div>
    </div>

  </main>

  <script>
    (function () {
      const saved = localStorage.getItem('honomassage-progress');
      if (saved) {
        try {
          const progress = JSON.parse(saved);
          const resumeBtn = document.getElementById('resume-btn');
          if (progress && progress.chapter) {
            resumeBtn.href = 'lecture.html?chapitre=' + progress.chapter;
            resumeBtn.style.display = 'inline-flex';
          }
        } catch (e) {
          // Donnée corrompue, on ignore silencieusement.
        }
      }
    })();
  </script>

  <script src="js/theme.js"></script>

</body>
</html>
